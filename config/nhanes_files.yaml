# NHANES files to download.
# Each cycle names its files differently:
#   2013-2014  suffix _H  (DEMO_H.XPT)
#   2015-2016  suffix _I  (DEMO_I.XPT)
#   2017-2020  prefix P_  (P_DEMO.XPT, the pre-pandemic release)
#
# Download URL: {base_url}/{dir}/DataFiles/{FILE}.XPT, where dir is the first
# year of the cycle (2017 for the P_ files).

base_url: "https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public"

cycles:
  - name: "2013-2014"
    dir: "2013"
    kind: suffix
    token: "_H"
  - name: "2015-2016"
    dir: "2015"
    kind: suffix
    token: "_I"
  - name: "2017-2020"
    dir: "2017"
    kind: prefix
    token: "P_"

# Components, without the cycle prefix/suffix.
components:
  - DEMO      # demographics
  - GHB       # HbA1c, full sample
  - TCHOL     # total cholesterol, full sample
  - HDL       # HDL cholesterol, full sample
  - TRIGLY    # triglycerides and LDL, fasting subsample
  - GLU       # fasting glucose, fasting subsample
  - CBC       # complete blood count, full sample
  - BIOPRO    # liver, kidney and electrolytes, subsample
  - VID       # vitamin D, 2013-2016 only
  - DIQ       # diabetes questionnaire (label only)
  - BPQ       # BP/cholesterol questionnaire (label only)
  - MCQ       # medical conditions (label only)
  - RXQ_RX    # prescriptions, for the statin/metformin flag (label only)

# Body measures (BMX) and blood pressure (BPX/BPXO) aren't downloaded because
# they aren't blood tests.
