  # ============================ VITAMINS ==================================
  # Vitamin D is lifestyle-actionable (sun exposure, diet, supplements).
  # UK thresholds (NHS/NICE): <25 deficient, 25-50 insufficient, >50 sufficient.
  vitamin_d:
    name: Vitamin D
    category: blood
    tier: actionable
    unit: " nmol/L"
    reference_range: {low: 50, high: 125}
    bands:
      - {status: low, max: 25, severity: borderline, direction: low,
         guideline: {source: NHS, code: "Vitamin D"},
         interpretation: "{name} {value}{unit} indicates deficiency (<25)."}
      - {status: borderline, min: 25, max: 50, severity: borderline, direction: low,
         guideline: {source: NHS, code: "Vitamin D"},
         interpretation: "{name} {value}{unit} indicates insufficiency (25-50)."}
