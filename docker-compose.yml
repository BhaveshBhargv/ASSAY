# Runs the FastAPI backend (:8000) and the Streamlit dashboard (:8502) from one image.
# Keys are read from a .env file in this directory (copy .env.example → .env).
#   docker compose up --build
# Optional local LLM:  docker compose --profile ollama up --build
#   then set OLLAMA_BASE_URL=http://ollama:11434 and provider=ollama.

x-app: &app
  build: .
  image: blood-recommender:latest
  restart: unless-stopped
  environment:
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ASSAY_OPENROUTER_MODEL: ${ASSAY_OPENROUTER_MODEL:-tencent/hy3:free}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    ASSAY_LOG_LEVEL: ${ASSAY_LOG_LEVEL:-INFO}
    ASSAY_CORS_ORIGINS: ${ASSAY_CORS_ORIGINS:-http://localhost:8501,http://localhost:8502}

services:
  api:
    <<: *app
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --app-dir src
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  dashboard:
    <<: *app
    command: >
      streamlit run streamlit_app/dashboard.py
      --server.port 8502 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8502:8502"
    depends_on:
      - api

  # Optional local LLM. Enable with:  docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
